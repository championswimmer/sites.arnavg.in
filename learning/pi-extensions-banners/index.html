<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi extension banners</title>
<meta name="description" content="Horizontal and vertical banners for Arnav Gupta's pi coding-agent extensions.">
<style>
:root{--bg:#0d1116;--panel:#161d27;--line:#495059;--text:#ebe7e4;--muted:#9fa4ab;--accent:#F1BE58}
@media (prefers-color-scheme:light){:root{--bg:#f3f2f0;--panel:#fff;--line:#c9c4bf;--text:#1b1f24;--muted:#5c5650;--accent:#b86b52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
main{max-width:1200px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:40px 0 4px}
p{color:var(--muted);margin:0 0 16px}
a{color:var(--accent)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btns button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;width:36px;height:36px;font:inherit;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
.track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 2px 16px;scrollbar-color:var(--line) transparent}
.card{flex:0 0 auto;margin:0;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.card img{display:block;height:auto;border-radius:4px}
.h .card{width:min(560px,85vw)} .h img{width:100%}
.v .card{width:min(300px,70vw)} .v img{width:100%}
figcaption{padding:8px 4px 2px;font-size:.9rem}
figcaption span{display:block;color:var(--muted);font-size:.8rem}
</style></head><body><main>

<script>
document.querySelectorAll(".btns button").forEach(function(b){
  b.addEventListener("click",function(){
    var t=document.getElementById(b.dataset.t);
    t.scrollBy({left:Number(b.dataset.d)*t.clientWidth*0.8,behavior:"smooth"});
  });
});
</script>
