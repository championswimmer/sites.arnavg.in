<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Your Coding Harness (15-min cut)</title>
<meta name="description" content="A 15-minute cut of the interactive talk: how a coding harness works, pi's lifecycle hooks, and three real extensions built on them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
<style>
/* ============================================================
   THEME TOKENS — semantic colours used by every section
   amber  = pi core / harness      teal   = events & hooks
   violet = extension code          blue   = model / provider
   coral  = tokens, cost, blocked   green  = saved, success
   ============================================================ */
:root {
  --bg: #0d0f15;
  --panel: #161a24;
  --panel-2: #1e2331;
  --line: #2d3346;
  --text: #eef1f7;
  --muted: #a3acbf;
  --amber: #ffb454;
  --teal: #3fdcd6;
  --violet: #b9a2ff;
  --blue: #74b9ff;
  --coral: #ff6f7d;
  --green: #7fe3a4;
  --head: "Space Grotesk", "Inter", Helvetica, sans-serif;
  --body: "Inter", Helvetica, Arial, sans-serif;
  --mono: "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
html, body { background: var(--bg); }
.reveal-viewport { background: radial-gradient(1200px 700px at 85% -10%, #1b2132 0%, var(--bg) 60%); }
.reveal { font-family: var(--body); font-size: 22pt; color: var(--text); }
.reveal .slides { text-align: left; }
.reveal .slides section { padding: 36px 64px; box-sizing: border-box; height: 100%; }
.reveal .slides section.stack { padding: 0; }

/* ---------- typography (never below 15pt anywhere) ---------- */
.reveal h1, .reveal h2, .reveal h3, .reveal h4 { font-family: var(--head); color: var(--text); text-transform: none; letter-spacing: -0.01em; margin: 0 0 18px; line-height: 1.08; }
.reveal h1 { font-size: 64pt; font-weight: 700; }
.reveal h2 { font-size: 38pt; font-weight: 700; }
.reveal h3 { font-size: 26pt; font-weight: 600; }
.reveal h4 { font-size: 21pt; font-weight: 600; }
.reveal p, .reveal li { font-size: 22pt; line-height: 1.35; color: var(--text); margin: 0 0 12px; }
.reveal ul, .reveal ol { margin: 0 0 0 1.1em; }
.reveal li { margin-bottom: 10px; }
.reveal strong { color: var(--amber); font-weight: 600; }
.reveal em { color: var(--teal); font-style: normal; }
.reveal code { font-family: var(--mono); font-size: 0.9em; color: var(--teal); background: rgba(63,220,214,.08); padding: 1px 8px; border-radius: 6px; }
.reveal a { color: var(--teal); }
.kicker { font-family: var(--mono); font-size: 15pt !important; letter-spacing: .14em; text-transform: uppercase; color: var(--teal) !important; margin-bottom: 8px !important; }
.muted { color: var(--muted) !important; }
.t-amber { color: var(--amber) !important; } .t-teal { color: var(--teal) !important; } .t-violet { color: var(--violet) !important; }
.t-blue { color: var(--blue) !important; } .t-coral { color: var(--coral) !important; } .t-green { color: var(--green) !important; }
.lead { font-size: 28pt !important; line-height: 1.3 !important; }
.huge { font-family: var(--head); font-size: 88pt !important; font-weight: 700; line-height: 1 !important; }
.small { font-size: 17pt !important; }
.center { text-align: center; }

/* ---------- code blocks ---------- */
.reveal pre { width: 100%; margin: 0; box-shadow: none; font-size: 17pt; line-height: 1.45; }
.reveal pre code { font-family: var(--mono); background: var(--panel); color: var(--text); padding: 20px 26px; border-radius: 14px; border: 1px solid var(--line); max-height: none; font-size: 1em; }
.reveal .hljs { background: var(--panel); }
.reveal pre code .hljs-ln-numbers { color: var(--muted); }
.code-label { font-family: var(--mono); font-size: 15pt !important; color: var(--muted) !important; margin: 0 0 6px !important; }

/* ---------- common components ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; }
.card h3, .card h4 { margin-bottom: 8px; }
.card p:last-child { margin-bottom: 0; }
.card.amber { border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
.card.teal { border-color: color-mix(in srgb, var(--teal) 55%, transparent); }
.card.violet { border-color: color-mix(in srgb, var(--violet) 55%, transparent); }
.card.blue { border-color: color-mix(in srgb, var(--blue) 55%, transparent); }
.card.coral { border-color: color-mix(in srgb, var(--coral) 55%, transparent); }
.card.green { border-color: color-mix(in srgb, var(--green) 55%, transparent); }

/* event / hook chip */
.hook { display: inline-block; font-family: var(--mono); font-size: 16pt; color: var(--teal); background: rgba(63,220,214,.1); border: 1px solid rgba(63,220,214,.45); border-radius: 999px; padding: 4px 14px; white-space: nowrap; transition: all .35s var(--ease); }
.hook.hot { background: var(--teal); color: #041413; box-shadow: 0 0 0 6px rgba(63,220,214,.18), 0 0 28px rgba(63,220,214,.5); }
.hook.mut::after { content: " ✎"; color: var(--amber); }
.hook.hot.mut::after { color: #041413; }

/* terminal window mock (pi TUI) */
.term { background: #0a0c11; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-family: var(--mono); font-size: 17pt; }
.term .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #141824; border-bottom: 1px solid var(--line); }
.term .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; display: block; }
.term .bar i:nth-child(2) { background: #febc2e; } .term .bar i:nth-child(3) { background: #28c840; }
.term .bar b { margin-left: 10px; color: var(--muted); font-weight: 400; font-size: 15pt; }
.term .body { padding: 16px 20px; line-height: 1.5; }
.term .body p { font-family: var(--mono); font-size: 17pt; margin: 0 0 4px; }
.term .status { border-top: 1px solid var(--line); padding: 8px 20px; color: var(--muted); font-size: 15pt; display: flex; gap: 26px; }

/* caption bar that changes per step */
.captions { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 56px; }
.captions > p { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 !important; font-family: var(--head); font-size: 26pt !important; color: var(--text); }
.captions > p b { color: var(--amber); font-weight: 600; }

/* step dots (auto-rendered by engine when .dots exists) */
.dots { display: flex; gap: 10px; }
.dots span { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: background .3s; }
.dots span.on { background: var(--teal); }

/* section divider */
section.divider { display: flex !important; flex-direction: column; justify-content: center; }
section.divider h1 { font-size: 80pt; }
section.divider .num { font-family: var(--mono); color: var(--teal); font-size: 22pt; margin-bottom: 18px; }

/* clickable things are obviously clickable */
.clickable, [data-click] { cursor: pointer; }
button.btn { font-family: var(--mono); font-size: 16pt; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 18px; cursor: pointer; transition: all .2s; }
button.btn:hover { border-color: var(--teal); color: var(--teal); }
button.btn.active { background: var(--teal); border-color: var(--teal); color: #041413; }

/* ============================================================
   STEP ENGINE — declarative state tied to the presenter's clicker
   <section class="stepper" data-steps="5">  → adds 5 invisible fragments
   [data-at="3"]      visible (class .on) once step >= 3
   [data-only="2 3"]  visible only while step is 2 or 3
   [data-hot="2"]     gets class .hot while step == 2  (not hidden)
   section gets classes s1..sN (reached) and data-step="N" (current)
   ============================================================ */
.reveal [data-at], .reveal [data-only] { transition: opacity .45s var(--ease), transform .45s var(--ease); }
.reveal [data-at]:not(.on), .reveal [data-only]:not(.on) { opacity: 0; pointer-events: none; }
.reveal [data-only]:not(.on) { transform: translateY(8px); }
.reveal .step-frag { display: none !important; }

/* the progress bar / controls tuned for dark */
.reveal .progress { color: var(--teal); height: 5px; }
.reveal .controls { color: var(--teal); }
.reveal .slide-number a { text-decoration: none; }
.reveal .slide-number { right: 90px; bottom: 14px; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 13pt; }

/* deck control bar: fullscreen / speaker-notes launch buttons */
.deck-controls { position: fixed; left: 24px; bottom: 20px; z-index: 40; display: flex; gap: 10px; }
.deck-ctrl-btn { display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); cursor: pointer; transition: all .2s var(--ease); }
.deck-ctrl-btn:hover, .deck-ctrl-btn:focus-visible { color: var(--teal); border-color: var(--teal); background: var(--panel-2); }
.deck-ctrl-btn svg { width: 20px; height: 20px; pointer-events: none; }
</style>
<script>
/* Deck: tiny helper API for part scripts. Parts call Deck.onStep(id, fn) / Deck.onEnter(id, fn). */
window.Deck = (function () {
  const stepFns = {}, enterFns = {}, leaveFns = {};
  const add = (m, id, fn) => { (m[id] = m[id] || []).push(fn); };
  function stepOf(sec) { return sec.querySelectorAll('.step-frag.visible').length; }
  function apply(sec) {
    if (!sec) return;
    const n = +sec.dataset.steps || 0, s = stepOf(sec);
    sec.dataset.step = s;
    for (let k = 1; k <= n; k++) sec.classList.toggle('s' + k, k <= s);
    sec.querySelectorAll('[data-at]').forEach(el => el.classList.toggle('on', s >= +el.dataset.at));
    sec.querySelectorAll('[data-only]').forEach(el => el.classList.toggle('on', el.dataset.only.split(/[ ,]+/).map(Number).includes(s)));
    sec.querySelectorAll('[data-hot]').forEach(el => el.classList.toggle('hot', el.dataset.hot.split(/[ ,]+/).map(Number).includes(s)));
    sec.querySelectorAll('.dots').forEach(d => {
      if (d.children.length !== n) d.innerHTML = '<span></span>'.repeat(n);
      [...d.children].forEach((c, i) => c.classList.toggle('on', i < s));
    });
    (stepFns[sec.id] || []).forEach(fn => { try { fn(s, sec); } catch (e) { console.error(e); } });
  }
  function prepare() {
    document.querySelectorAll('section.stepper').forEach(sec => {
      const n = +sec.dataset.steps || 0;
      for (let k = 0; k < n; k++) {
        const f = document.createElement('i');
        f.className = 'fragment step-frag';
        f.dataset.fragmentIndex = k;
        sec.appendChild(f);
      }
    });
  }
  return {
    onStep: (id, fn) => add(stepFns, id, fn),
    onEnter: (id, fn) => add(enterFns, id, fn),
    onLeave: (id, fn) => add(leaveFns, id, fn),
    prepare, apply,
    _enter(sec) { if (sec) (enterFns[sec.id] || []).forEach(fn => { try { fn(sec); } catch (e) { console.error(e); } }); },
    _leave(sec) { if (sec) (leaveFns[sec.id] || []).forEach(fn => { try { fn(sec); } catch (e) { console.error(e); } }); },
  };
})();
</script>
</head>
<body>
<div class="reveal">
<div class="slides">
