name: update-listings

# Listing pages (research/index.html, learning/index.html, plans/index.html) are generated —
# agents only add research/<slug>/, learning/<slug>/ or plans/<slug>/ dirs; this fills in the links.
on:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'learning/**'
      - 'plans/**'
      - '!research/index.html'
      - '!learning/index.html'
      - '!plans/index.html'

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Compute GA lookup window start
        run: |
          printf 'GA_LOOKBACK_SINCE=%s\n' "$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(hours=24)).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_ENV"
      - name: Fetch last 24 hours of history for GA page lookup
        run: |
          git fetch --update-shallow \
            --shallow-since="$GA_LOOKBACK_SINCE" \
            origin "${GITHUB_REF_NAME}" \
            || { echo "Failed to fetch enough history for the GA lookup window."; exit 1; }
      # Defense-in-depth: `paths:` above already prevents the workflow from
      # starting on unrelated pushes (zero minutes). This guard fails fast
      # inside the job for edge cases (manual re-runs, mixed-file pushes
      # where only outside files changed, future workflow_dispatch, etc.).
      - name: Guard - exit early unless research/, learning/ or plans/ changed
        id: guard
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- research learning plans 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under research/, learning/ or plans/. Skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Relevant changes:"
            echo "$CHANGED"
          fi
      - name: Inject GA snippet into pages added in the last 24 hours or last commit
        if: steps.guard.outputs.changed == 'true'
        run: |
          {
            git log --since="$GA_LOOKBACK_SINCE" --diff-filter=A --name-only --format='' -- research learning plans
            git diff-tree --no-commit-id --name-only -r --diff-filter=A HEAD -- research learning plans
          } \
            | awk 'NF && /(^|\/)index\.html$/ { print }' \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done \
            | sort -u > /tmp/ga_pages.txt
          if [ -s /tmp/ga_pages.txt ]; then
            tr '\n' '\0' < /tmp/ga_pages.txt | xargs -0 python3 .github/scripts/inject-ga.py
          else
            echo "No candidate HTML pages from the last 24 hours or last commit. Skipping GA injection."
          fi
      - if: steps.guard.outputs.changed == 'true'
        run: python3 .github/scripts/update-listings.py
      - if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research learning plans
          git diff --cached --quiet || git commit -m "auto: regenerate listings and inject GA snippet into new pages"
          git push
